plugins {
    id 'com.android.application'
}

android {
    namespace 'br.edu.spottingai.drone'
    compileSdk 34
    // O DJI SDK v4 ainda usa o cliente HTTP legado do Apache (igual ao sample oficial).
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        // O App Key da DJI e vinculado a este package name (cadastre o mesmo no portal).
        applicationId 'br.edu.spottingai.drone'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
        ndk {
            // Mesmas ABIs do sample oficial do MSDK 4.18.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Equivale a android:extractNativeLibs="true", exigido pelo SDK.
            useLegacyPackaging = true
            // Equivale aos "doNotStrip" do sample oficial (Sample Code/app/build.gradle, v4.18).
            keepDebugSymbols += [
                '*/*/libdjivideo.so',
                '*/*/libSDKRelativeJNI.so',
                '*/*/libFlyForbid.so',
                '*/*/libduml_vision_bokeh.so',
                '*/*/libyuv2.so',
                '*/*/libGroudStation.so',
                '*/*/libFRCorkscrew.so',
                '*/*/libUpgradeVerify.so',
                '*/*/libFR.so',
                '*/*/libDJIFlySafeCore.so',
                '*/*/libdjifs_jni.so',
                '*/*/libsfjni.so',
                '*/*/libDJICommonJNI.so',
                '*/*/libDJICSDKCommon.so',
                '*/*/libDJIUpgradeCore.so',
                '*/*/libDJIUpgradeJNI.so',
                '*/*/libDJIWaypointV2Core.so',
                '*/*/libAMapSDK_MAP_v6_9_2.so',
                '*/*/libDJIMOP.so',
                '*/*/libDJISDKLOGJNI.so',
            ]
        }
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }
}

dependencies {
    // DJI Mobile SDK v4 (ultima versao: 4.18). NAO exclua 'library-anti-distortion':
    // sem ela o VideoDataListener pode nunca ser chamado em drones que precisam de
    // calibracao de distorcao, e o feed transcodificado usa o quadro calibrado.
    implementation 'com.dji:dji-sdk:4.18'
    compileOnly 'com.dji:dji-sdk-provided:4.18'

    implementation 'androidx.multidex:multidex:2.0.1'

    // Alinha kotlin-stdlib / -jdk7 / -jdk8 trazidos por dependencias diferentes
    // (sem isso: "Duplicate class kotlin.collections.jdk8...").
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // Bibliotecas de runtime que o sample oficial declara junto com o SDK.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Os layouts internos do dji-sdk (ex.: dji_dialog_login.xml) usam ConstraintLayout.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.4'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'com.google.guava:guava:29.0-android'
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
